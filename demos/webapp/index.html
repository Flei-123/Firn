<!-- demos/webapp/index.html -- the programs of examples/fui/ (lib/fui/app.fi)
     in the browser: the SAME source as the native X11 window, built with
     firnc --target=wasm32-browser. Serve the directory over HTTP:
         python3 -m http.server -d demos/webapp 8000
     then http://localhost:8000/?wasm=hello_window.wasm&w=400&h=250
     (counter.wasm: w=300&h=200, form.wasm: w=420&h=300; without w/h the
     program fills the page). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firn -- fUi app</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f4f4f6; }
  canvas { display: block; outline: none; touch-action: none; }
</style>
</head>
<body>
<canvas id="firn" tabindex="0"></canvas>
<script src="firn.js"></script>
</body>
</html>
