<!-- demos/mcweb/index.html -- the voxel scenes of tools/gpu/web/web_main.fi on a WebGL2 canvas (docs/WEBGL2.md).
     Build the module:  firnc --opt-level=release-safe --target=wasm32-browser -o demos/mcweb/mcscene.wasm tools/gpu/web/web_main.fi
     Serve this directory over http (fetch of the .wasm does not work from file://). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Firn WebGL2 voxel back end</title>
<style>
  body { background: #111; color: #ddd; font: 13px monospace; margin: 12px; }
  canvas { image-rendering: pixelated; width: 640px; height: 360px; border: 1px solid #444; display: block; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<pre id="out"></pre>
<div id="shots" hidden></div>
<script src="glweb.js"></script>
<script>
(async () => {
    const out = document.getElementById('out');
    const shots = document.getElementById('shots');
    const run = await startMcWeb({
        canvas: document.getElementById('c'),
        wasm: new URLSearchParams(location.search).get('wasm') || 'mcscene.wasm',
        onText: (s) => { out.textContent += s; },
        // one PNG of the canvas after every scene (read by tools/gpu/web/check.py)
        onPresent: (cv) => { const i = document.createElement('img'); i.src = cv.toDataURL('image/png'); shots.appendChild(i); },
    });
    out.textContent += 'exit=' + run.exit_code + '\n' + (run.gl ? 'gl: ' + run.gl.renderer + ' | ' + run.gl.version + '\n' : '') + (run.error ? 'error: ' + run.error + '\n' : '');
    document.title = 'DONE';
})();
</script>
</body>
</html>
