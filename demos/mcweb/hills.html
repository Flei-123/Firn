<!-- demos/mcweb/hills.html -- the hills demo (tools/gpu/web/hills_web.fi): WebGL2 canvas, WASD to move, click = mouse look (Pointer Lock).
     Build:  bash tools/mc/web/build.sh <outdir>   (writes hills.wasm and copies this page + glweb.js), then serve <outdir> over http.
     ?check=1  = test mode (tools/mc/web/check.py): the page injects the key script of hills.fi (script_keys), takes a PNG of the canvas at the
                 snapshot frames, counts frames in onPresent and stops after 40 frames. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Firn hills demo (WebGL2)</title>
<style>
  body { background: #111; color: #ddd; font: 13px monospace; margin: 12px; }
  canvas { image-rendering: pixelated; width: 640px; height: 360px; border: 1px solid #444; display: block; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c" width="320" height="180" tabindex="0"></canvas>
<pre id="out"></pre>
<div id="shots" hidden></div>
<script src="glweb.js"></script>
<script>
window.addEventListener('error', (e) => { const o = document.getElementById('out'); if (o) o.textContent += 'jserror: ' + e.message + '\n'; });
window.addEventListener('unhandledrejection', (e) => { const o = document.getElementById('out'); if (o) o.textContent += 'jsrej: ' + (e.reason && e.reason.stack || e.reason) + '\n'; });
(async () => {
    const q = new URLSearchParams(location.search);
    const check = q.get('check') === '1';
    const out = document.getElementById('out');
    const shots = document.getElementById('shots');
    // the same script as hills.script_keys: key W frames 4..11, D 14..21, S 24..27 (frame f sees what was injected after the present of f-1)
    const SCRIPT = [[4, 11, 'KeyW'], [14, 21, 'KeyD'], [24, 27, 'KeyS']];
    const SNAPS = [0, 8, 16, 24, 39];
    const LAST = 39;
    const held = {};
    let frame = 0;                                   // frames presented so far = index of the frame that just finished
    let run = null;
    const onPresent = (cv) => {
        const f = frame++;
        if (!check) return;
        if (SNAPS.includes(f)) {
            const i = document.createElement('img');
            i.src = cv.toDataURL('image/png'); i.dataset.frame = String(f);
            shots.appendChild(i);
        }
        if (f >= LAST) { if (run && run.stop) run.stop(); return; }
        const g = f + 1;                             // inject for the next frame
        for (const [a, b, code] of SCRIPT) {
            const want = g >= a && g <= b;
            if (want !== !!held[code] && run && run.input) { run.input.key(want ? 1 : 0, code, ''); held[code] = want; }
        }
    };
    run = await startMcWeb({
        canvas: document.getElementById('c'),
        wasm: q.get('wasm') || 'hills.wasm',
        onText: (s) => { out.textContent += s; },
        onPresent,
        onStop: (r) => {
            out.textContent += 'exit=' + r.exit_code + ' frames=' + frame + '\n' + (r.gl ? 'gl: ' + r.gl.renderer + ' | ' + r.gl.version + '\n' : '') + (r.error ? 'error: ' + r.error + '\n' : '');
            document.title = 'DONE';
        },
        timerLoop: check,
        lockOnClick: !check,
        captureKeys: !check,
    });
    if (!run.loop) {                                  // module ended in _start (no WebGL2, error)
        out.textContent += 'exit=' + run.exit_code + '\n' + (run.error ? 'error: ' + run.error + '\n' : '');
        document.title = 'DONE';
    }
})();
</script>
</body>
</html>
