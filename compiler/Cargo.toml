[package]
name = "firnc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "firnc"
path = "src/main.rs"

[[bin]]
name = "asmdiff"
path = "src/bin/asmdiff.rs"

[[bin]]
name = "sprungdiff"
path = "src/bin/sprungdiff.rs"

[[bin]]
name = "a64diff"
