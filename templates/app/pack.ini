# pack.ini -- what the packages (tools/pack, `bash package.sh`) say about @NAME@.
# key=value, one per line. The version is not here: it is VERSION.
id=@ID@
name=@NAME@
vendor=@VENDOR@
summary=@NAME@
description=
url=
license=MPL-2.0
# freedesktop main category (Utility, Game, Network, Office, Graphics, AudioVideo, Development)
category=Utility
# the launcher icon: an SVG (sharp at every size) or a PNG of 1024x1024; icon_bg is the
# colour behind it on Android (RRGGBB)
icon=assets/icon.svg
icon_bg=1D9A5B
android_id=@ANDROID_ID@
# Debian dependencies: the X11 window loads DejaVu Sans
depends=fonts-dejavu-core | fonts-dejavu
