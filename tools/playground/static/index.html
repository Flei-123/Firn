<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firn Playground</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Firn <span>Playground</span></h1>
  <label class="field">Example
    <select id="examples"></select>
  </label>
  <button id="run" type="button"><span id="run-label">&#9654; Run</span> <kbd>Ctrl+Enter</kbd></button>
  <span id="status" role="status"></span>
</header>
<main>
  <section class="pane" aria-label="Editor">
    <div class="pane-title">main.fi</div>
    <div class="editor">
      <div id="gutter" aria-hidden="true"></div>
      <div class="code">
        <pre id="highlight" aria-hidden="true"></pre>
        <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Firn source"></textarea>
      </div>
    </div>
    <div id="problem-list" hidden></div>
    <div id="statusbar">
      <button id="problems" type="button" class="ok">&#10003; no problems</button>
      <button id="problem-message" type="button" hidden></button>
      <span id="checking"></span>
      <span id="position">Ln 1, Col 1</span>
    </div>
  </section>
  <section class="pane" aria-label="Output">
    <div class="pane-title">Terminal <span id="meta"></span></div>
    <div id="output"><p class="hint">Press Run to compile and execute.</p></div>
  </section>
</main>
<div id="tooltip" role="tooltip" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
