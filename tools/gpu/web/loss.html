<!-- tools/gpu/web/loss.html -- gate 141: takes the WebGL2 context away (WEBGL_lose_context.loseContext) after a few frames and
     gives it back (restoreContext) once the page saw `webglcontextlost`; web_loss_main.fi prints what it saw. -->
<html lang="en"><head><meta charset="utf-8"><title>loss</title></head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<pre id="out"></pre>
<script>
// Headless Chromium under --virtual-time-budget never fires requestAnimationFrame: drive the loop by timers instead
// (the frame function and the context events are the same; only the clock source differs).
window.requestAnimationFrame = (f) => setTimeout(() => f(performance.now()), 16);
window.cancelAnimationFrame = (id) => clearTimeout(id);
</script>
<script>
// a fake standard gamepad in slot 0 (headless Chromium has none): A held, left stick right, left trigger 0.5; unplugged when padGone is set
window.padGone = false;
navigator.getGamepads = () => window.padGone ? [null, null, null, null] : [{
    connected: true, mapping: 'standard',
    buttons: Array.from({ length: 17 }, (_, i) => ({ pressed: i === 0, value: i === 6 ? 0.5 : (i === 0 ? 1 : 0) })),
    axes: [1, 0, 0, 0],
}, null, null, null];
</script>
<script src="glweb.js"></script>
<script>
(async () => {
    const out = document.getElementById('out');
    const cv = document.getElementById('c');
    let phase = 0, ext = null;
    const run = await startMcWeb({
        canvas: cv, wasm: new URLSearchParams(location.search).get('wasm') || 'loss.wasm', input: false,
        onText: (s) => { out.textContent += s; },
        onContext: (what) => { out.textContent += 'page: context ' + what + '\n'; },
    });
    const timer = setInterval(() => {
        const gl = cv.getContext('webgl2');
        if (phase === 0 && run.frames >= 4 && gl) {
            ext = gl.getExtension('WEBGL_lose_context');
            if (!ext) { out.textContent += 'page: no WEBGL_lose_context\n'; clearInterval(timer); document.title = 'DONE'; return; }
            ext.loseContext(); phase = 1;
        } else if (phase === 1 && run.ctx_lost_count > 0) {
            // let a few frames pass while lost, then restore
            phase = 2; setTimeout(() => { ext.restoreContext(); phase = 3; }, 300);
        } else if (run.exit_code !== -1 && run.exit_code !== 0 && phase < 3) {
            clearInterval(timer); document.title = 'DONE';
        }
        if (run.stopped || (phase === 3 && run.ctx_restored_count > 0 && run.frames > 0 && out.textContent.match(/context loss (ok|FAIL)/))) {
            clearInterval(timer);
            window.padGone = true; out.textContent += 'page: lost=' + run.ctx_lost_count + ' restored=' + run.ctx_restored_count + ' frames=' + run.frames + '\n';
            document.title = 'DONE';
        }
    }, 50);
})();
</script>
</body></html>
