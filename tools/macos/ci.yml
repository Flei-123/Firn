name: macos
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install lld
        run: brew install lld
      - name: Build firnc
        run: cd compiler && cargo build --release
      - name: Compile and run on Apple Silicon
        env:
          FIRNLIB: ${{ github.workspace }}/lib
          FIRN_DARWIN_LD: /opt/homebrew/opt/lld/bin/ld64.lld
        run: |
          set -e
          FIRNC=compiler/target/release/firnc
          for t in tests/001_return_const.fi examples/hello.fi tests/1331_str_concat.fi tests/1610_hash_map.fi tests/2101_threads_portable.fi; do
            $FIRNC --target=aarch64-macos "$t" -o /tmp/prog
            codesign -dv /tmp/prog || codesign -s - /tmp/prog
            /tmp/prog || echo "exit $? for $t"
          done
      - name: Intel build under Rosetta
        env:
          FIRNLIB: ${{ github.workspace }}/lib
          FIRN_DARWIN_LD: /opt/homebrew/opt/lld/bin/ld64.lld
        run: |
          compiler/target/release/firnc --target=x86_64-macos examples/hello.fi -o /tmp/prog_x86
          arch -x86_64 /tmp/prog_x86 || echo "exit $?"
