# Standalone tool: not part of the compiler and no dependency on it.
# No external crates (std only), so that cargo build works offline.
[workspace]

[package]
name = "testrunner"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "testrunner"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 2
