<!doctype html>
<html><head><style>
@font-face { font-family: FirnMetric; src: url(FirnMetric.ttf) }
* { margin: 0; padding: 0; border: 0 }
html { font-family: FirnMetric; font-size: 20px }
.z0 { position: absolute; left: 0; top: 0; width: 250px; height: 250px;
      z-index: 0 }
.za { position: absolute; left: 260px; top: 0; width: 250px; height: 250px }
.deep { position: absolute; left: 0; top: 0; width: 250px; height: 250px;
        z-index: 50 }
.cover { position: absolute; left: 100px; top: 100px; width: 400px;
         height: 100px; z-index: 1 }
</style></head>
<body>
<div class="z0"><div class="deep"></div></div>
<div class="za"><div class="deep"></div></div>
<div class="cover"></div>
</body></html>
