<!doctype html>
<html><head><style>
@font-face { font-family: FirnMetric; src: url(FirnMetric.ttf) }
* { margin: 0; padding: 0; border: 0 }
html { font-family: FirnMetric; font-size: 20px }
.host { position: relative; width: 500px; height: 300px }
.blk { width: 400px; height: 120px }
.flt { float: left; width: 150px; height: 200px; margin-top: -100px }
.abs { position: absolute; left: 80px; top: 40px; width: 200px; height: 150px }
.neg { position: absolute; left: 0; top: 0; width: 500px; height: 300px;
       z-index: -1 }
</style></head>
<body>
<div class="host">
  <div class="neg"></div>
  <div class="blk"></div>
  <div class="flt"></div>
  <div class="abs"></div>
</div>
</body></html>
