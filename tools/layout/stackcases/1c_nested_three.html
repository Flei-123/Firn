<!doctype html>
<html><head><style>
@font-face { font-family: FirnMetric; src: url(FirnMetric.ttf) }
* { margin: 0; padding: 0; border: 0 }
html { font-family: FirnMetric; font-size: 20px }
.l1 { position: absolute; left: 0; top: 0; width: 400px; height: 400px;
      z-index: 1 }
.l2 { position: absolute; left: 40px; top: 40px; width: 300px; height: 300px;
      z-index: 1 }
.l3 { position: absolute; left: 40px; top: 40px; width: 200px; height: 200px;
      z-index: -1 }
.sib { position: absolute; left: 200px; top: 200px; width: 300px;
       height: 300px; z-index: 1 }
</style></head>
<body>
<div class="l1"><div class="l2"><div class="l3"></div></div></div>
<div class="sib"></div>
</body></html>
