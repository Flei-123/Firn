<!-- examples/codehub/site/index.html -- the CodeHub page of
     examples/codehub/codehub.fi, compiled to WebAssembly
     (examples/codehub/web.fi) and painted by fUi into this one <canvas>.
     Serve the directory over HTTP, e.g.
     `python3 -m http.server -d examples/codehub/site 8000`. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeHub -- fUi im Browser</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0e1014; }
  canvas { display: block; outline: none; touch-action: none; }
</style>
</head>
<body>
<canvas id="firn" tabindex="0"></canvas>
<script src="firn.js" data-wasm="codehub.wasm" data-font="DejaVuSans.ttf"
        data-fonts="DejaVuSansMono.ttf,DejaVuSans-Bold.ttf"></script>
</body>
</html>
