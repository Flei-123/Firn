<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Firn Remote</title>
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#111;color:#eee;font:16px system-ui}
#pad{flex:1;margin:10px;border-radius:18px;background:#222;touch-action:none;display:grid;place-items:center;color:#555}
#bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 10px 10px}
button{font-size:22px;padding:14px 0;border:0;border-radius:12px;background:#333;color:#eee}
#st{position:fixed;top:14px;right:18px;font-size:13px;color:#888}
</style>
<div id="st">…</div>
<div id="pad">Touchpad</div>
<div id="bar">
<button data-c="click">L</button><button data-c="rclick">R</button><button data-c="scroll,3">▲</button><button data-c="scroll,-3">▼</button>
<button data-c="vol-">🔉</button><button data-c="mute">🔇</button><button data-c="vol+">🔊</button><button data-c="play">⏯</button>
</div>
<script>
let ws, last, moved, t0, fingers, fx = 0, fy = 0, sy = 0;
function connect() {
  ws = new WebSocket((location.protocol == "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => st.textContent = "connected";
  ws.onclose = () => { st.textContent = "offline"; setTimeout(connect, 1000); };
}
connect();
const send = m => ws.readyState == 1 && ws.send(m);
const on = (ev, f) => pad.addEventListener(ev, e => { e.preventDefault(); f(e); }, { passive: false });
on("touchstart", e => { const t = e.touches[0]; last = [t.clientX, t.clientY]; moved = 0; t0 = Date.now(); fingers = e.touches.length; });
on("touchmove", e => {
  const t = e.touches[0], dx = t.clientX - last[0], dy = t.clientY - last[1];
  last = [t.clientX, t.clientY]; moved += Math.abs(dx) + Math.abs(dy);
  if (e.touches.length > 1) { sy += dy; const s = Math.trunc(sy / 25); if (s) { send("scroll," + -s); sy -= s * 25; } return; }
  fx += dx * 2; fy += dy * 2; const ix = Math.trunc(fx), iy = Math.trunc(fy);
  if (ix || iy) { send("move," + ix + "," + iy); fx -= ix; fy -= iy; }
});
on("touchend", e => { if (e.touches.length == 0 && moved < 10 && Date.now() - t0 < 300) send(fingers > 1 ? "rclick" : "click"); });
for (const b of document.querySelectorAll("button")) b.onclick = () => send(b.dataset.c);
</script>
